name: Security & Quality Checks

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ═══════════════════════════════════════════════════════════════
  # SAST SCAN — Find vulnerabilities in code
  # ═══════════════════════════════════════════════════════════════
  codeql:
    name: 'CodeQL SAST Scan'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python, javascript, typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ═══════════════════════════════════════════════════════════════
  # SECRET DETECTION — Find hardcoded credentials
  # ═══════════════════════════════════════════════════════════════
  secret-detection:
    name: 'Secret Scanning'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ═══════════════════════════════════════════════════════════════
  # DEPENDENCY SCANNING — Find vulnerable libraries
  # ═══════════════════════════════════════════════════════════════
  dependency-check:
    name: 'Dependency Scanning'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dependency-check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: '.'
          format: 'JSON'
          args: >
            --exclude .git
            --exclude .venv
            --exclude node_modules
            --exclude dist
            --exclude build

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'reports/dependency-check-report.sarif'

  # ═══════════════════════════════════════════════════════════════
  # PYTHON LINTING — Python/code validation
  # ═══════════════════════════════════════════════════════════════
  lint-python:
    name: 'Python Linting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install --no-cache-dir pylint bandit

      - name: Run Python linting
        run: |
          echo "🔍 Running Python linting..."
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" | head -20 | xargs pylint --disable=all --enable=syntax-error || true
          echo "✓ Lint check complete"
        continue-on-error: true

      - name: Run Bandit security check
        run: |
          echo "🔍 Running Bandit security check..."
          bandit -r . --exclude '.git,.venv' -f json -o bandit-report.json || true
          echo "✓ Bandit check complete"
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # YAML VALIDATION — YAML files validation
  # ═══════════════════════════════════════════════════════════════
  lint-yaml:
    name: 'YAML Validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows
          strict: false
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2

  # ═══════════════════════════════════════════════════════════════
  # SUMMARY — Report all results
  # ═══════════════════════════════════════════════════════════════
  security-summary:
    name: 'Security Summary'
    runs-on: ubuntu-latest
    needs: [codeql, secret-detection, dependency-check, lint-python, lint-yaml]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "✅ Security checks completed"
          echo "CodeQL: ${{ needs.codeql.result }}"
          echo "Secret Detection: ${{ needs.secret-detection.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"
          echo "Python Lint: ${{ needs.lint-python.result }}"
          echo "YAML Lint: ${{ needs.lint-yaml.result }}"
